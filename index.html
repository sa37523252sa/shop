<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>雲端同步商城</title>
    <style>
        /* 這裡保留你原本的 CSS 樣式... */
        body{font-family: Arial, sans-serif; margin:16px; background:#f7f7f8;}
        .card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,0.1);margin-bottom:12px}
        .btn{padding:8px 12px; cursor:pointer}
        .btn-primary{background:#2b8cff;color:#fff}
        .product-img { width: 100%; height: 200px; object-fit: contain; }
    </style>
</head>
<body>
<header style="display:flex; justify-content:space-between;">
    <h1>雲端商城</h1>
    <div id="userArea">載入中...</div>
</header>

<div class="container">
    <div class="card">
        <button class="btn btn-primary" id="openAuth">登入 / 註冊</button>
        <button class="btn" id="openAdmin" style="display:none">管理後台</button>
    </div>
    <div id="mainContent" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;"></div>
</div>

<div id="adminPanel" style="display:none;" class="card">
    <h3>管理後台</h3>
    <form id="productForm">
        <input id="prodTitle" placeholder="商品名稱" required><br>
        <input id="prodPrice" placeholder="價格" type="number" required><br>
        <button type="submit" class="btn btn-primary">確認新增商品</button>
        <button type="button" class="btn" onclick="document.getElementById('adminPanel').style.display='none'">關閉</button>
    </form>
</div>

<script>
const API_BASE = "https://shop-3b84.onrender.com"; // 你的 Render 網址

// 1. 抓取商品改為從 Render 抓取
async function fetchProducts() {
    try {
        const res = await fetch(`${API_BASE}/api/products/list`);
        const data = await res.json();
        const container = document.getElementById('mainContent');
        container.innerHTML = data.map(p => `
            <div class="card">
                <img src="${p.imagePath ? API_BASE+'/'+p.imagePath : ''}" class="product-img">
                <h4>${p.title}</h4>
                <p>價格: ${p.price}</p>
            </div>
        `).join('');
    } catch (err) {
        console.error("無法載入商品", err);
    }
}

// 2. 修正新增商品邏輯
document.getElementById('productForm').onsubmit = async (e) => {
    e.preventDefault();
    const title = document.getElementById('prodTitle').value;
    const price = document.getElementById('prodPrice').value;
    const token = localStorage.getItem('shop_token'); // 需從登入取得 token

    try {
        const res = await fetch(`${API_BASE}/api/products/add`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}` 
            },
            body: JSON.stringify({ title, price })
        });
        if(res.ok) {
            alert("新增成功！");
            fetchProducts();
        }
    } catch (err) {
        alert("新增失敗，請檢查權限");
    }
};

fetchProducts();
</script>
</body>
</html>
