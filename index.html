<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>簡易商品訂購系統 - 雲端同步版</title>
    <style>
        body { font-family: Arial, "Noto Sans TC", sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        header { background: #fff; padding: 12px 16px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 960px; margin: auto; padding: 16px; }
        .card { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .product-img { width: 100%; height: 220px; object-fit: contain; background: #fff; border-radius: 6px; }
        .btn { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; }
        .btn-primary { background: #2b8cff; color: #fff; }
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .option-row { display: flex; gap: 8px; margin-bottom: 8px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div>
        <h1 style="font-size:18px; margin:0;">簡易商品訂購系統</h1>
        <div style="font-size:12px; color: #666;">後端狀態：Render 雲端同步中</div>
    </div>
    <div id="userArea" style="font-size:14px;">載入中...</div>
</header>

<div class="container">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div style="display:flex; gap:8px; flex:1;">
                <input id="searchInput" placeholder="搜尋雲端商品..." style="flex:1;">
                <button class="btn" id="searchBtn">搜尋</button>
            </div>
            <div id="actionBtns">
                <button class="btn" id="openLogin">登入 / 註冊</button>
                <button class="btn btn-primary" id="openAdmin" style="display:none">新增商品</button>
            </div>
        </div>
    </div>
    <div id="mainContent" class="grid"></div>
</div>

<div id="authModal" class="modal-backdrop">
    <div class="modal">
        <h3 id="authTitle">會員登入</h3>
        <input id="authEmail" placeholder="Email" style="width:95%; margin-bottom:10px;">
        <input id="authPassword" placeholder="密碼" type="password" style="width:95%; margin-bottom:10px;">
        <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" id="loginSubmit">登入</button>
            <button class="btn" id="registerSubmit">註冊</button>
            <button class="btn" onclick="closeModal('authModal')">取消</button>
        </div>
    </div>
</div>

<div id="adminModal" class="modal-backdrop">
    <div class="modal">
        <h3>新增商品 (雲端同步)</h3>
        <label>商品名稱</label><br>
        <input id="prodTitle" style="width:95%; margin-bottom:10px;" placeholder="例如：珍珠奶茶"><br>
        <label>上傳圖片</label><br>
        <input id="prodImage" type="file" accept="image/*" style="width:95%; margin-bottom:10px;"><br>
        <label>商品選項（名稱與價格）</label>
        <div id="optionsContainer" style="margin-top:10px;"></div>
        <button class="btn" onclick="addOptionField()" style="margin-bottom:15px; background:#eee;">+ 新增選項</button>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" id="saveProduct">確認上架</button>
            <button class="btn" onclick="closeModal('adminModal')">取消</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = "https://shop-3b84.onrender.com";
    let currentUser = JSON.parse(localStorage.getItem('shop_user') || 'null');
    let authToken = localStorage.getItem('shop_token') || '';

    window.onload = () => {
        updateUserUI();
        fetchProducts();
        addOptionField(); 
    };

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function handleAuth(type) {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        if(!email || !password) return alert("請填寫完整資訊");

        const path = type === 'login' ? '/api/auth/login' : '/api/auth/register';
        try {
            const res = await fetch(`${API_BASE}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, name: email.split('@')[0] })
            });
            const data = await res.json();
            if (res.ok) {
                if(type === 'login') {
                    localStorage.setItem('shop_token', data.token);
                    localStorage.setItem('shop_user', JSON.stringify(data.user));
                    alert("登入成功！");
                    location.reload();
                } else {
                    alert("註冊成功，請登入！");
                }
            } else { alert(data.message || "驗證失敗"); }
        } catch (err) { alert("無法連線至伺服器"); }
    }

    async function fetchProducts(keyword = "") {
        const container = document.getElementById('mainContent');
        container.innerHTML = "載入中...";
        try {
            let url = `${API_BASE}/api/products/list`;
            if(keyword) url = `${API_BASE}/api/products/search?keyword=${encodeURIComponent(keyword)}`;
            const res = await fetch(url);
            const products = await res.json();
            container.innerHTML = "";
            if(!products || products.length === 0) {
                container.innerHTML = "<div class='card'>目前雲端沒有商品</div>";
                return;
            }
            products.forEach(p => {
                const div = document.createElement('div');
                div.className = 'card';
                const imgSrc = p.image_url || (p.imagePath ? `${API_BASE}/${p.imagePath}` : 'https://placehold.co/400');
                div.innerHTML = `
                    <img src="${imgSrc}" class="product-img" onerror="this.src='https://placehold.co/400'">
                    <h3 style="margin:10px 0;">${p.title}</h3>
                    <div style="color:#2b8cff; font-weight:bold;">${p.options?.[0] ? p.options[0].name + ': $' + p.options[0].price : '無價格'}</div>
                    <button class="btn btn-primary" style="width:100%; margin-top:10px;">立即訂購</button>
                `;
                container.appendChild(div);
            });
        } catch (err) { container.innerHTML = "連線失敗，請稍後再試。"; }
    }

   async function saveProductToCloud(e) {
    if (e) e.preventDefault();
    const btn = document.getElementById('saveProduct');
    
    // 檢查登入狀態
    if (!authToken) return alert("錯誤：找不到登入憑證，請重新登入！");

    const title = document.getElementById('prodTitle').value;
    const imageFile = document.getElementById('prodImage').files[0];
    const rows = document.querySelectorAll('.option-row');
    const options = [];

    rows.forEach(row => {
        const name = row.querySelector('.opt-name').value;
        const price = row.querySelector('.opt-price').value;
        if(name && price) options.push({ name, price });
    });

    if(!title || options.length === 0) return alert("請填寫商品名稱與至少一個價格");

    // UI 反饋：按鈕變色代表正在跑
    btn.innerText = "上傳中...";
    btn.disabled = true;

    const formData = new FormData();
    formData.append('title', title);
    if (imageFile) formData.append('image', imageFile);
    formData.append('options', JSON.stringify(options)); 

    try {
        const res = await fetch(`${API_BASE}/api/products/add`, {
            method: 'POST',
            headers: { 
                'Authorization': `Bearer ${authToken}` 
                // 注意：這裡絕對不能加 'Content-Type': 'application/json'
            },
            body: formData
        });

        const result = await res.json();

        if (res.ok) {
            alert("✨ 商品新增成功！");
            location.reload();
        } else {
            alert("失敗：" + (result.message || "伺服器錯誤"));
        }
    } catch (err) {
        alert("連線失敗！請檢查 Render Logs 是否報錯");
        console.error(err);
    } finally {
        btn.innerText = "確認上架";
        btn.disabled = false;
    }
}

    function updateUserUI() {
        const area = document.getElementById('userArea');
        const adminBtn = document.getElementById('openAdmin');
        if(currentUser) {
            area.innerHTML = `你好, ${currentUser.name} <button class="btn" onclick="logout()" style="padding:2px 8px; font-size:12px;">登出</button>`;
            if(currentUser.is_admin) adminBtn.style.display = 'inline-block';
        } else {
            area.innerHTML = "訪客模式";
        }
    }

    function addOptionField() {
        const container = document.getElementById('optionsContainer');
        const div = document.createElement('div');
        div.className = 'option-row';
        div.innerHTML = `
            <input class="opt-name" placeholder="名稱(如:大份)" style="flex:2;">
            <input class="opt-price" placeholder="價格" type="number" style="flex:1;">
            <button class="btn" onclick="this.parentElement.remove()" style="background:#ff4d4d; color:white;">X</button>
        `;
        container.appendChild(div);
    }

    function logout() { localStorage.clear(); location.reload(); }

    document.getElementById('openLogin').onclick = () => openModal('authModal');
    document.getElementById('loginSubmit').onclick = () => handleAuth('login');
    document.getElementById('registerSubmit').onclick = () => handleAuth('register');
    document.getElementById('openAdmin').onclick = () => openModal('adminModal');
    document.getElementById('saveProduct').onclick = saveProductToCloud;
    document.getElementById('searchBtn').onclick = () => fetchProducts(document.getElementById('searchInput').value);
</script>
</body>
</html>
