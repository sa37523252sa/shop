<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>簡易商品訂購系統（雲端同步版）</title>
<style>
  body{font-family: Arial, "Noto Sans TC", sans-serif; margin:16px; background:#f7f7f8;}
  header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
  h1{margin:0;font-size:18px}
  .btn{padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
  .btn-primary{background:#2b8cff;color:#fff;border-color:#2b8cff}
  .container{margin-top:12px}
  .card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,0.04);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .product-img { width: 100%; height: 200px; object-fit: contain; background: #fff; border-radius: 6px; }
  .small{font-size:13px;color:#666}
  .muted{color:#666;font-size:13px}
  .admin-badge{background:#ffd700;padding:4px 8px;border-radius:999px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>簡易商品訂購系統（雲端同步）</h1>
  <div id="userArea"><span class="muted">載入中...</span></div>
</header>

<div class="container">
  <div class="card">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="flex:1">
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input id="searchInput" placeholder="輸入關鍵字搜尋雲端商品" style="width:100%;padding:6px;border-radius:6px;border:1px solid #ccc;" />
          <button class="btn" id="searchBtn">搜尋</button>
        </div>
        <div class="small">目前狀態：<span id="currentUserInfo">未登入</span></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" id="openAuth">登入 / 註冊</button>
        <button class="btn" id="openAdmin" style="display:none">管理後台</button>
      </div>
    </div>
  </div>

  <div id="mainContent" class="grid">
    </div>
</div>

<script>
// ====== 1. 基本設定：連向您的 Render 後端 ======
const API_BASE = "https://shop-3b84.onrender.com"; //
let currentUser = JSON.parse(localStorage.getItem('shop_user') || 'null');

// ====== 2. 核心功能：從雲端抓取商品 ======
async function fetchProducts(keyword = "") {
  const mainContent = document.getElementById('mainContent');
  try {
    // 修正路徑，連向後端的 /api/products/list
    let url = `${API_BASE}/api/products/list`;
    if (keyword) url = `${API_BASE}/api/products/search?keyword=${encodeURIComponent(keyword)}`;
    
    const res = await fetch(url);
    if (!res.ok) throw new Error("伺服器回應錯誤");
    const data = await res.json();

    mainContent.innerHTML = '';
    if (!data || data.length === 0) {
      mainContent.innerHTML = '<div class="card">雲端目前沒有商品</div>';
      return;
    }

    data.forEach(p => {
      const div = document.createElement('div');
      div.className = 'card';
      // 處理圖片路徑：優先使用雲端網址，若無則組合 Render 本地路徑
      const imgSrc = p.image_url || (p.imagePath ? `${API_BASE}/${p.imagePath}` : '');
      div.innerHTML = `
        <img src="${imgSrc}" class="product-img" onerror="this.src='https://placehold.co/400?text=無圖片'" />
        <h4 style="margin:8px 0">${p.title}</h4>
        <div class="small muted">商品編號: ${p.id}</div>
        <button class="btn" style="margin-top:8px;width:100%">查看詳情</button>
      `;
      mainContent.appendChild(div);
    });
  } catch (err) {
    mainContent.innerHTML = `<div class="card">連線失敗。請確認 Render 伺服器已啟動（需等待約 1 分鐘）。</div>`;
  }
}

// ====== 3. 使用者介面更新 ======
function updateUI() {
  const info = document.getElementById('currentUserInfo');
  const userArea = document.getElementById('userArea');
  const adminBtn = document.getElementById('openAdmin');

  if (currentUser) {
    info.textContent = `${currentUser.name} (${currentUser.email})`;
    userArea.innerHTML = `<button class="btn" onclick="logout()">登出</button>`;
    if (currentUser.is_admin) adminBtn.style.display = 'inline-block';
  } else {
    info.textContent = '未登入';
    userArea.innerHTML = '<span class="muted">訪客模式</span>';
    adminBtn.style.display = 'none';
  }
}

function logout() {
  localStorage.removeItem('shop_user');
  location.reload();
}

// ====== 4. 初始化 ======
document.getElementById('searchBtn').onclick = () => fetchProducts(document.getElementById('searchInput').value);
updateUI();
fetchProducts();

</script>
</body>
</html>
